<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dan Han Trading</title>
<script src="config.js"></script>
<link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b0b0e">
<meta name="color-scheme" content="light dark">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0e;--sf:#151519;--ink:#f2f2f5;--mut:#9a9aa8;--line:#26262e;--up:#10b981;--dn:#ef4444;--acc:#a855f7;--cy:#06b6d4;--yl:#facc15;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lg{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#06b6d4,#a855f7);display:grid;place-items:center;flex:none}
nav{display:flex;gap:2px;padding:4px;border:1px solid var(--line);border-radius:16px;background:var(--sf)}
nav button{width:44px;height:40px;border:0;border-radius:12px;background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer}
nav button.on{background:#25252c;color:var(--cy)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gear{width:44px;height:44px;border-radius:50%;border:1px solid #4c2a85;background:#2a1747;color:var(--acc);display:grid;place-items:center;cursor:pointer;flex:none}
button:focus-visible,input:focus-visible,select:focus-visible,.rw:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
p{margin:0}.sub,.mut{color:var(--mut)}.sub{margin-bottom:14px}.small{font-size:13px}
.hd{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px}.hd h1{font-size:34px;line-height:1.1;margin:0;font-weight:800}
.plus{width:52px;height:52px;border-radius:50%;border:0;background:#1e1e25;color:var(--cy);font-size:30px;cursor:pointer;line-height:1}
.card{background:var(--sf);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px}
.card h2{font-size:22px;margin:0 0 6px;font-weight:700}
.card.g1{background:linear-gradient(135deg,#06b6d4,#3b82f6 60%,#2563eb);border:0}.card.g2{background:linear-gradient(135deg,#a855f7,#c026d3);border:0}
.card.go{border-color:var(--up);box-shadow:0 0 24px #10b98133}.card.no{border-color:var(--dn)}.card.wa{border-color:var(--yl)}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--acc)}
.big{font-size:44px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.rings{display:flex;justify-content:space-around;margin:6px 0 18px}.rg{text-align:center;font-size:12px;letter-spacing:.1em;color:var(--mut);font-weight:700;text-transform:uppercase}.rg svg{width:100px;height:100px;display:block;margin:0 auto 6px}
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.g2c .card{margin:0;padding:16px}.g2c b{display:block;font-size:28px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}.chips button{flex:none;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:var(--sf);color:var(--mut);font:700 15px Inter,sans-serif;cursor:pointer}.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;border:1px solid var(--line);border-radius:20px;background:#0f0f13;margin-bottom:12px;cursor:pointer}.rw b{display:block}.rw small{color:var(--mut)}
.ck{width:34px;height:34px;border-radius:50%;border:2px solid #3a3a45;display:grid;place-items:center;font-style:normal;flex:none;color:var(--mut)}.rw.on .ck{background:var(--up);border-color:var(--up);color:#06281d;font-weight:800}.rw.bad .ck{border-color:var(--dn);color:var(--dn)}
.seg{display:flex;border:1px solid var(--line);border-radius:16px;padding:4px;background:#0f0f13}.seg button{flex:1;padding:12px;border:0;border-radius:12px;background:none;color:var(--mut);font:700 15px Inter,sans-serif;cursor:pointer}.seg button.l.on{background:#0b3b2e;color:var(--up)}.seg button.s.on{background:#431b1b;color:var(--dn)}
.bar{height:10px;border-radius:6px;background:#25252c;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%}.bl{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
.eqb{display:flex;align-items:flex-end;gap:6px;height:110px}.eqb i{flex:1;border-radius:4px}
.wl{font-weight:700;font-size:18px;margin:6px 0}.up{color:var(--up)}.dn{color:var(--dn)}.yl{color:var(--yl)}
.nf{display:flex;gap:8px;margin-top:12px}.nf input{flex:1}.nf input[type=time]{flex:0 0 120px}
.stp{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.stp span{padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--mut)}.stp span.on{background:var(--acc);color:#fff;border-color:var(--acc)}.stp span.dn2{color:var(--up);border-color:var(--up)}
.b,.btn{display:inline-block;padding:12px 18px;border-radius:14px;border:1px solid var(--acc);background:var(--acc);color:#fff;font:700 15px Inter,sans-serif;cursor:pointer;margin:8px 8px 0 0}.b.alt,.btn.alt{background:none;color:var(--ink);border-color:var(--line)}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px}form label{display:flex;flex-direction:column;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700;gap:6px}form .w{grid-column:1/-1}
input,select{font:16px Inter,sans-serif;padding:14px;border:1px solid var(--line);border-radius:16px;background:#0b0b0e;color:var(--ink);width:100%;min-width:0}
.tr{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}.tr small{color:var(--mut);display:block}.tr button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:13px}
.msg{padding:12px 14px;border-radius:16px;background:var(--sf);border:1px solid var(--line);margin-bottom:12px;font-size:15px}
.ins{background:var(--sf);border:1px solid var(--line);border-left:5px solid var(--cy);border-radius:16px;padding:12px 14px;margin-bottom:10px}.ins.warn{border-left-color:var(--dn)}.ins.good{border-left-color:var(--up)}.ins h3{margin:0 0 4px;font-size:17px}.ins p{color:var(--mut)}
.empty{border-style:dashed;text-align:center;color:var(--mut)}

.card{border-radius:20px;padding:18px}.big{font-size:38px;letter-spacing:-.02em}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.hero h1{font-size:30px;font-weight:800;margin:4px 0 6px;line-height:1.15}
.sess{background:linear-gradient(180deg,#18181f,#121216)}.sess.open{border-color:var(--up);box-shadow:0 8px 30px #10b98122}
.clk{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;margin-bottom:10px}
.sz{font-size:26px;font-weight:800;margin:6px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.tile{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px}.tile b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.tile span{font-size:12px;color:var(--mut)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.kp b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.kp span{font-size:12px;color:var(--mut)}
.sc{display:flex;gap:6px}.sc button{padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--mut);font:600 13px Inter,sans-serif;cursor:pointer}.sc button.on{background:#25252c;color:var(--ink)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;gap:8px}.sec h3{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.tog{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--ink);font:700 16px Inter,sans-serif;cursor:pointer;margin-bottom:12px}
.chev{transition:transform .2s}.tog.open .chev{transform:rotate(180deg)}@media (prefers-reduced-motion:reduce){.chev{transition:none}}
p.fl{margin-top:12px}.fl b{display:block}.fl span{font-size:14px}
.lgb{width:44px;height:44px;border:0;padding:0;border-radius:12px;overflow:hidden;background:#000;cursor:pointer;flex:none}.lgb img{display:block;width:100%;height:100%}
form{grid-template-columns:repeat(2,minmax(0,1fr))}form label,form .seg{min-width:0}
input,select{max-width:100%;text-overflow:ellipsis}
input[type=datetime-local],input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;min-height:52px;text-align:left}
input[readonly]{color:var(--ink);cursor:default}
.seg{width:100%}

<div style="margin-top:10px">${s.tAmt?bar('Profit target',`${money(Math.max(0,s.pl))} of ${money(s.tAmt)} (${Math.round(pc(s.pl,s.tAmt))}%)`,pc(s.pl,s.tAmt),'up'):''}${a.ddd?bar('Daily drawdown used',`${money(s.dUsed)} of ${money(s.dLim)}`,dp,dp>=80?'dn':dp>=50?'yl':'cy'):''}${a.dmx?bar(`Max drawdown used (${a.dtype})`,`${money(mUsed)} of ${money(s.mLim)}`,mp,mp>=80?'dn':mp>=50?'yl':'cy'):''}</div>
<p>${st}</p><p class="mut small" style="margin-top:6px">${s.ts.length} trades this phase. Drawdown uses closed trades only.</p>
${(a.hist||[]).map(x=>`<p class="mut small">✓ ${esc(x.d)} · ${esc(x.e)} (${money(x.pl)})</p>`).join('')}
${seq.length&&a.phase!='f'?`<button class="b ${s.hit?'':'alt'}" onclick="adv('${a.id}')">${s.hit?'Advance to next step':'Move to next step'}</button>`:''}<button class="b alt" onclick="delAcc('${a.id}')">Delete</button></div>`}
function acctView(){return`<div class="hd"><h1>Accounts</h1><button class="plus" aria-label="Add account" onclick="showAF=!showAF;render()">${showAF?'×':'+'}</button></div>`+(showAF?afForm():'')+(AT.length?AT.map(acCard).join(''):'<div class="card empty">No accounts yet. Tap + to add a prop challenge, funded or live account. You can add as many as you need.</div>')}
function settingsView(){const e=etInfo(),row=(x,y)=>`<div class="tr"><span>${x}</span><b>${y}</b></div>`;
return`<div class="hd"><h1>Settings</h1></div>
<div class="card"><div class="sec"><h3>Preferences</h3></div><form onsubmit="return false"><label class="w">Your name<input value="${esc(PREF.name)}" placeholder="Trader" onchange="PREF.name=this.value.trim();savePref()"></label><label class="w">Time format<select onchange="PREF.h24=this.value=='24';savePref();render()"><option value="12" ${PREF.h24?'':'selected'}>12-hour</option><option value="24" ${PREF.h24?'selected':''}>24-hour</option></select></label></form><p class="mut small" style="margin-top:10px">All times follow Eastern Time (${e.abbr}), including daylight saving changes.</p></div>
<div class="card"><div class="sec"><h3>Trading plan</h3></div>${row('London kill zone',fmt(180)+'–'+fmt(240)+' ET')}${row('New York kill zone',fmt(600)+'–'+fmt(660)+' ET')}${row('Days','Mon–Fri (markets open)')}${row('Risk per trade','0.5%')}${row('Daily loss limit','−1% (two stop-outs)')}${row('Weekly loss limit','−2%')}${row('Targets','50% at 1:3 · rest at 1:10')}<p class="mut small" style="margin-top:10px">These come from your plan and are read-only. The plan says not to change them mid-week.</p></div>
<div class="card"><div class="sec"><h3>Data</h3></div><form onsubmit="return false"><label class="w">Balance when no account is selected<input type="number" value="${CFG.bal||''}" onchange="CFG.bal=+this.value||0;saveCfg();render()"></label><label class="w">Hours to add to imported CSV times to get ET<input type="number" value="${CFG.off}" onchange="CFG.off=+this.value||0;saveCfg()"></label></form><label class="btn alt" tabindex="0">Import CSV<input type="file" accept=".csv,text/csv" hidden onchange="onFile(this)"></label><button class="b alt" onclick="exp()">Export CSV</button><button class="b alt" onclick="T=sample();save();render()">Load sample data</button><button class="b alt" onclick="if(confirm('Delete ALL trades?')){T=[];save();render()}">Delete all trades</button></div>`+(MEM?`<div class="card"><div class="sec"><h3>What your coach remembers</h3></div><p>${esc(MEM).replace(/\n/g,'<br>')}</p></div>`:'')+`<div class="card"><div class="sec"><h3>Profile</h3></div><p class="mut" style="margin-bottom:8px">${esc(UEMAIL||'Signed in')}</p><button class="b" style="margin-top:0" onclick="out()">Sign out</button></div>`}
function exp(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
const csv='date,symbol,side,pnl,size,duration,emotion,plan,note\n'+T.map(t=>[t.d,t.s,t.side,t.p,t.z,t.m,t.e,t.f==null?'':t.f?'yes':'no',t.n].map(q).join(',')).join('\n');
msg='Copy of your data is below the list.';const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='trades.csv';a.click()}
function stat(A){const now=new Date(),td=etNow().slice(0,10),mon=new Date(now);mon.setDate(now.getDate()-(now.getDay()+6)%7);const wk=iso(mon).slice(0,10);
const tt=A.filter(t=>t.d.slice(0,10)==td),ww=A.filter(t=>t.d.slice(0,10)>=wk),rs=a=>sum(a.map(Rv).filter(x=>x!=null)),dR=rs(tt),wR=rs(ww),ls=tt.filter(t=>Rv(t)<0).length;
return{tt,ww,dR,wR,ls,dl:ls>=2||dR*.5<=-1,wl:wR*.5<=-2}}
function statusBox(A){const q=stat(A),Rs=A.map(Rv).filter(x=>x!=null),FL=A.filter(t=>t.flt),ok=FL.filter(t=>FILT.every(f=>t.flt[f[0]]===true)).length;
return`<div class="stats"><div><b class="${cls(q.dR)}">${fm(q.dR)}R</b><span>Today · ${q.tt.length} trades</span></div><div><b class="${cls(q.wR)}">${fm(q.wR)}R</b><span>This week</span></div><div><b class="${cls(avg(Rs))}">${fm(avg(Rs))}R</b><span>Expectancy</span></div><div><b>${FL.length?Math.round(ok/FL.length*100)+'%':'–'}</b><span>Plan-complete</span></div></div>`+(q.dl?card(['warn','Daily limit reached','Two stop-outs or -1% today (1R = 0.5%). Close the platform.']):'')+(q.wl?card(['warn','Weekly limit reached','-2% this week. Done until Monday.']):'')}
function bars(A){const g={'London 3–4':0,'NY 10–11':0,'Outside':0};A.forEach(t=>{const v=Rv(t);if(v==null)return;const h=hrG(t);g[h==3?'London 3–4':h==10?'NY 10–11':'Outside']+=v});const m=Math.max(1,...Object.values(g).map(Math.abs));
return`<div style="margin-bottom:16px">`+Object.entries(g).map(([k,v])=>`<div class="tr"><span style="width:92px">${k}</span><span style="flex:1"><i style="display:block;height:10px;margin-top:7px;width:${Math.abs(v)/m*100}%;background:var(--${v<0?'dn':'up'})"></i></span><b class="${cls(v)}">${fm(v)}R</b></div>`).join('')+`</div>`}
let CH=[],MEM='',busy=false,SETUP={},IMGS=[];
function shrink(file){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const sc=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.8);URL.revokeObjectURL(u);res({m:'image/jpeg',d:d.split(',')[1],u:d})};im.onerror=()=>res(null);im.src=u})}
async function pick(el){for(const f of [...el.files].slice(0,4-IMGS.length)){const r=await shrink(f);if(r)IMGS.push(r)}el.value='';render()}
function coachView(){const TF=[['4h','4H','Monthly cycle'],['1h','1H','Weekly cycle'],['15m','15m','Daily cycle'],['5m','5m','90-Min cycle'],['1m','1m','Trigger']],S={ok:['✓','up'],fail:['✕','dn'],unclear:['?','yl'],none:['○','mut']};
const rv=`<div class="card"><div class="lab">Chart review for this setup</div>`+TF.map(([k,l,c])=>{const x=SETUP[k]||{s:'none',n:'Not sent yet'},z=S[x.s]||S.none;return`<div class="tr"><div><b>${l}</b> <span class="mut">${c}</span><small>${esc(x.n||'')}</small></div><b class="${z[1]}">${z[0]}</b></div>`}).join('')+`<button class="b alt" onclick="SETUP={};CH=[];IMGS=[];render()">New setup</button></div>`;
return`<p class="sub">Send charts one timeframe at a time (4H, 1H, 15m, 5m, 1m). The coach checks only what your plan requires on each one and asks for what is missing. Tell it once how you define SSMT, LRLQ and displacement, and it remembers.</p>`+rv+(MEM?`<div class="msg"><b>What I remember</b><br>${esc(MEM).replace(/\n/g,'<br>')}</div>`:'')+CH.map(m=>`<div class="msg" style="${m.role=='user'?'text-align:right':''}">${(m.th||[]).map(u=>`<img src="${u}" alt="Chart" style="max-width:48%;border-radius:10px;margin:0 4px 6px 0">`).join('')}${esc(m.text).replace(/\n/g,'<br>')}</div>`).join('')+(busy?'<div class="msg">Reading your chart…</div>':'')+
`<form onsubmit="ask(event)">${IMGS.length?`<div class="w">${IMGS.map(i=>`<img src="${i.u}" alt="Attached chart" style="width:23%;border-radius:8px;margin-right:2%">`).join('')}</div>`:''}<label class="w">Ask your coach<input id="q" autocomplete="off" placeholder="e.g. 1H chart: I see a weekly SSMT. Check it."></label><div class="w"><button class="b" type="submit">Send</button><label class="btn alt" tabindex="0">📎 Chart<input type="file" accept="image/*" multiple hidden onchange="pick(this)"></label><button class="b alt" type="button" onclick="ask(null,'Give me my weekly review: KPIs, my top 3 mistakes with trade evidence, and one rule to focus on.')">Analyze</button><button class="b alt" type="button" onclick="ask(null,'Quiz me on my trade plan rules, one question at a time. Use only my plan.')">Quiz me</button></div></form>`}
function buildCtx(a){const A=a.A,q=stat(A),Rs=A.map(Rv).filter(x=>x!=null),et=new Date().toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit',hour12:false});
const line=t=>[t.d.replace('T',' '),t.s||'?',t.dir||t.side||'?',Rv(t)==null?'R?':fm(Rv(t))+'R',t.flt?'missing:'+(FILT.filter(f=>t.flt[f[0]]!==true).map(f=>f[0]).join(',')||'none')+' breaches:'+(BRK.filter(f=>t.flt[f[0]]).map(f=>f[0]).join(',')||'none'):'unjournaled',t.e||''].join(' | ');
return`Current time ET: ${et}. Journal timestamps are ET${CFG.off?' after a '+CFG.off+'h shift':''}. Balance: ${CFG.bal||'not set'}. 1R = 0.5% of balance.\nToday: ${q.tt.length} trades, ${q.dR.toFixed(2)}R, ${q.ls} stop-outs, daily limit hit: ${q.dl}. Week: ${q.wR.toFixed(2)}R, weekly limit hit: ${q.wl}.\nAll-time: ${A.length} trades, ${Rs.length} with R, net ${sum(Rs).toFixed(2)}R, expectancy ${avg(Rs).toFixed(2)}R, win rate ${Math.round(a.st.wr*100)}%.\nAccounts (prop tracker): ${AT.map(accLine).join(' ; ')||'none'}\nSystem-detected flags:\n${a.out.map(o=>'- ['+o.l+'] '+o.t+': '+o.x).join('\n')}\nLast 40 trades (date | symbol | dir | R | filters missing | self-reported breaches | emotion):\n${A.slice(-40).map(line).join('\n')}`}
async function ask(e,pre){if(e)e.preventDefault();let q=pre||document.getElementById('q').value.trim();if(!q&&IMGS.length)q='Review the attached chart(s) against my plan.';if(!q||busy)return;CH.push({role:'user',text:q,imgs:IMGS.map(i=>({m:i.m,d:i.d})),th:IMGS.map(i=>i.u)});IMGS=[];busy=true;render();
try{const ses=(await sb.auth.getSession()).data.session,r=await fetch(SUPABASE_URL+'/functions/v1/coach',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ses.access_token,apikey:SUPABASE_KEY},body:JSON.stringify({messages:CH.slice(-10).map((m,i,z)=>({role:m.role,text:m.text,imgs:i==z.length-1?m.imgs||[]:[]})),ctx:buildCtx(analyze(T)),setup:SETUP})});
const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);CH.push({role:'coach',text:j.reply});if(j.memory)MEM=j.memory;if(j.setup)SETUP=j.setup}catch(err){CH.push({role:'coach',text:'Coach error: '+err.message})}busy=false;render()}
function authView(){document.getElementById('nav').innerHTML='';
document.getElementById('v').innerHTML=`<div style="text-align:center;margin:8px 0 22px"><img src="${LOGO}" alt="Dan Han Trading" width="132" height="132" style="border-radius:28px"><h1 style="font-size:26px;margin:14px 0 4px">Dan Han Trading</h1><p class="mut">Sign in to your trading coach</p></div>`+(msg?`<div class="msg">${esc(msg)}</div>`:'')+`<form onsubmit="return false"><label class="w">Email<input id="em" type="email" autocomplete="email"></label><label class="w">Password (8 or more characters)<input id="pw" type="password" autocomplete="current-password"></label><div class="w"><button class="b" onclick="auth('in')">Sign in</button><button class="b alt" onclick="auth('up')">Create account</button></div></form>`}
async function auth(m){const e=document.getElementById('em').value.trim(),p=document.getElementById('pw').value;
const r=m=='in'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p});
if(r.error){msg=r.error.message;return render()}

await boot()}
async function boot(){if(SUPABASE_URL.includes('PASTE')){msg='Setup needed: paste your Supabase URL and anon key at the top of the script (see README).';return render()}
sb=sb||supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const g=await sb.auth.getSession();UID=g.data.session?g.data.session.user.id:null;UEMAIL=g.data.session?g.data.session.user.email:'';T=[];SRV=new Set();AT=[];SRVA=new Set();
if(UID){const a=await sb.from('trades').select('*').order('d').range(0,4999);T=(a.data||[]).map(x=>({...x,p:+x.p,z:+x.z,m:+x.m,r:x.r==null?null:+x.r}));SRV=new Set(T.map(t=>t.id));
const c=await sb.from('settings').select('*').maybeSingle();if(c.data)CFG={bal:+c.data.bal,off:+c.data.tzoff};const mm=await sb.from('coach_memory').select('notes').maybeSingle();MEM=mm.data?mm.data.notes:'';const ac=await sb.from('accounts').select('*').order('created');AT=(ac.data||[]).map(a=>({...a,size:+a.size,ddd:+a.ddd,dmx:+a.dmx,t1:+a.t1,t2:+a.t2,steps:+a.steps,hist:a.hist||[]}));SRVA=new Set(AT.map(a=>a.id))}
msg=msg.startsWith('Setup')?msg:'';render()}

setInterval(()=>{if(UID&&tab=='home'){const e=document.getElementById('sess');if(e){e.innerHTML=sessInner();e.className='card sess'+(sess().open?' open':'')}}},1000);

boot();
