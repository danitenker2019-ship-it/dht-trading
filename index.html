<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DHT Edge</title>
<script src="config.js?v=17"></script>
<link rel="apple-touch-icon" href="icon-v2-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-v2-32.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#060808">
<meta name="color-scheme" content="light dark">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060808;--sf:#0a0e0c;--ink:#f0f4f0;--mut:#7f9482;--line:#171f1a;--up:#62dc34;--dn:#ff5563;--acc:#6fe82c;--cy:#38bdf8;--yl:#facc15;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lg{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#06b6d4,#a855f7);display:grid;place-items:center;flex:none}
nav{display:flex;gap:2px;padding:4px;border:1px solid var(--line);border-radius:16px;background:var(--sf)}
nav button{width:44px;height:40px;border:0;border-radius:12px;background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer}
nav button.on{background:#25252c;color:var(--cy)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gear{width:44px;height:44px;border-radius:50%;border:1px solid #4c2a85;background:#2a1747;color:var(--acc);display:grid;place-items:center;cursor:pointer;flex:none}
button:focus-visible,input:focus-visible,select:focus-visible,.rw:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
p{margin:0}.sub,.mut{color:var(--mut)}.sub{margin-bottom:14px}.small{font-size:13px}
.hd{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px}.hd h1{font-size:34px;line-height:1.1;margin:0;font-weight:800}
.plus{width:52px;height:52px;border-radius:50%;border:0;background:#1e1e25;color:var(--cy);font-size:30px;cursor:pointer;line-height:1}
.card{background:var(--sf);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px}
.card h2{font-size:22px;margin:0 0 6px;font-weight:700}
.card.g1{background:linear-gradient(135deg,#06b6d4,#3b82f6 60%,#2563eb);border:0}.card.g2{background:linear-gradient(135deg,#a855f7,#c026d3);border:0}
.card.go{border-color:var(--up);box-shadow:0 0 24px #10b98133}.card.no{border-color:var(--dn)}.card.wa{border-color:var(--yl)}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--acc)}
.big{font-size:44px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.rings{display:flex;justify-content:space-around;margin:6px 0 18px}.rg{text-align:center;font-size:12px;letter-spacing:.1em;color:var(--mut);font-weight:700;text-transform:uppercase}.rg svg{width:100px;height:100px;display:block;margin:0 auto 6px}
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.g2c .card{margin:0;padding:16px}.g2c b{display:block;font-size:28px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}.chips button{flex:none;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:var(--sf);color:var(--mut);font:700 15px Inter,sans-serif;cursor:pointer}.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;border:1px solid var(--line);border-radius:20px;background:#0f0f13;margin-bottom:12px;cursor:pointer}.rw b{display:block}.rw small{color:var(--mut)}
.ck{width:34px;height:34px;border-radius:50%;border:2px solid #3a3a45;display:grid;place-items:center;font-style:normal;flex:none;color:var(--mut)}.rw.on .ck{background:var(--up);border-color:var(--up);color:#06281d;font-weight:800}.rw.bad .ck{border-color:var(--dn);color:var(--dn)}
.seg{display:flex;border:1px solid var(--line);border-radius:16px;padding:4px;background:#0f0f13}.seg button{flex:1;padding:12px;border:0;border-radius:12px;background:none;color:var(--mut);font:700 15px Inter,sans-serif;cursor:pointer}.seg button.l.on{background:#0b3b2e;color:var(--up)}.seg button.s.on{background:#431b1b;color:var(--dn)}
.bar{height:10px;border-radius:6px;background:#25252c;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%}.bl{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
.eqb{display:flex;align-items:flex-end;gap:6px;height:110px}.eqb i{flex:1;border-radius:4px}
.wl{font-weight:700;font-size:18px;margin:6px 0}.up{color:var(--up)}.dn{color:var(--dn)}.yl{color:var(--yl)}
.nf{display:flex;gap:8px;margin-top:12px}.nf input{flex:1}.nf input[type=time]{flex:0 0 120px}
.stp{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.stp span{padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--mut)}.stp span.on{background:var(--acc);color:#fff;border-color:var(--acc)}.stp span.dn2{color:var(--up);border-color:var(--up)}
.b,.btn{display:inline-block;padding:12px 18px;border-radius:14px;border:1px solid var(--acc);background:var(--acc);color:#fff;font:700 15px Inter,sans-serif;cursor:pointer;margin:8px 8px 0 0}.b.alt,.btn.alt{background:none;color:var(--ink);border-color:var(--line)}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px}form label{display:flex;flex-direction:column;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700;gap:6px}form .w{grid-column:1/-1}
input,select{font:16px Inter,sans-serif;padding:14px;border:1px solid var(--line);border-radius:16px;background:#0b0b0e;color:var(--ink);width:100%;min-width:0}
.tr{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}.tr small{color:var(--mut);display:block}.tr button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:13px}
.msg{padding:12px 14px;border-radius:16px;background:var(--sf);border:1px solid var(--line);margin-bottom:12px;font-size:15px}
.ins{background:var(--sf);border:1px solid var(--line);border-left:5px solid var(--cy);border-radius:16px;padding:12px 14px;margin-bottom:10px}.ins.warn{border-left-color:var(--dn)}.ins.good{border-left-color:var(--up)}.ins h3{margin:0 0 4px;font-size:17px}.ins p{color:var(--mut)}
.empty{border-style:dashed;text-align:center;color:var(--mut)}

.card{border-radius:20px;padding:18px}.big{font-size:38px;letter-spacing:-.02em}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.hero h1{font-size:30px;font-weight:800;margin:4px 0 6px;line-height:1.15}
.sess{background:linear-gradient(180deg,#18181f,#121216)}.sess.open{border-color:var(--up);box-shadow:0 8px 30px #10b98122}
.clk{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;margin-bottom:10px}
.sz{font-size:26px;font-weight:800;margin:6px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.tile{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px}.tile b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.tile span{font-size:12px;color:var(--mut)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.kp b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.kp span{font-size:12px;color:var(--mut)}
.sc{display:flex;gap:6px}.sc button{padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--mut);font:600 13px Inter,sans-serif;cursor:pointer}.sc button.on{background:#25252c;color:var(--ink)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;gap:8px}.sec h3{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.tog{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--ink);font:700 16px Inter,sans-serif;cursor:pointer;margin-bottom:12px}
.chev{transition:transform .2s}.tog.open .chev{transform:rotate(180deg)}@media (prefers-reduced-motion:reduce){.chev{transition:none}}
p.fl{margin-top:12px}.fl b{display:block}.fl span{font-size:14px}
.lgb{width:44px;height:44px;border:0;padding:0;border-radius:12px;overflow:hidden;background:#000;cursor:pointer;flex:none}.lgb img{display:block;width:100%;height:100%}
form{grid-template-columns:repeat(2,minmax(0,1fr))}form label,form .seg{min-width:0}
input,select{max-width:100%;text-overflow:ellipsis}
input[type=datetime-local],input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;min-height:52px;text-align:left}
input[readonly]{color:var(--ink);cursor:default}
.seg{width:100%}

.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.2fr);gap:5px;margin-top:14px}
.ch{font-size:10px;letter-spacing:.1em;color:var(--mut);text-align:center;padding:2px 0}
.cd{min-height:60px;border:1px solid var(--line);border-radius:10px;padding:5px;display:flex;flex-direction:column;justify-content:space-between;background:#0f0f13;min-width:0}
.cd.off{background:transparent;border-color:#1b1b21}
.cd .dn0{font-size:11px;color:var(--mut)}.cd b{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}.cd small{font-size:9px;color:var(--mut)}
.cd.g{background:#102a1b;border-color:#1f6b3a}.cd.g .dn0,.cd.g b{color:var(--up)}
.cd.r{background:#2e1417;border-color:#7a2a2a}.cd.r .dn0,.cd.r b{color:var(--dn)}
.cd.td{outline:1px solid var(--cy);outline-offset:1px}
.cw{min-height:60px;border:1px solid var(--line);border-radius:10px;padding:5px;display:flex;flex-direction:column;justify-content:space-between;text-align:right;min-width:0}.cw b{font-size:12px;white-space:nowrap}.cw small{font-size:9px;color:var(--mut)}
.mbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:20px;cursor:pointer;line-height:1}
.cmsg{margin-top:16px;font-size:16px;font-weight:600}

.cal .cd{cursor:pointer}.cd.em .dn0{opacity:.5}.cd.sel{outline:2px solid var(--yl);outline-offset:1px}
.cal b,.kt4 b,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.kt4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:16px}.kt4>div{border:1px solid var(--line);border-radius:12px;padding:10px 8px;background:#0f0f13;min-width:0}
.kt4 span{display:block;min-height:22px;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);line-height:1.3}.kt4 b{display:block;font-size:15px;margin-top:6px;white-space:nowrap}.kt4 small{font-size:9px;color:var(--mut)}
.dday{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#0f0f13}.dday .dk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}.dday .dk b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.dday .dk span{font-size:11px;color:var(--mut)}
.xbtn{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer;padding:4px 8px}
.cw{cursor:pointer}.cw.sel{outline:2px solid var(--yl);outline-offset:1px}.tr.tap{cursor:pointer}

/* ============ DARK GREEN THEME (calm) ============ */
::selection{background:#6fe82c;color:#031003}
*{scrollbar-color:#1f2b23 #060808}
html{background:#060808}
body{background:#060808;color:var(--ink)}
header{background:rgba(6,8,8,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid #141a16}
.lg{background:linear-gradient(135deg,#5fd12a,#1f7a2a)}
nav{background:#0a0e0c;border-color:#161d19}
nav button.on{background:#0e1a10;color:#7dff2e;box-shadow:0 0 0 1px #1f4a22}
nav button.on svg{filter:drop-shadow(0 0 3px rgba(125,255,46,.45))}
.gear{border-color:#1f4a22;background:#0b150d;color:#6fe82c}
.card{background:#0a0e0c;box-shadow:none}
.card:hover{border-color:#1f2b23}
.card.g1{background:linear-gradient(135deg,#0c2a10,#16661a)}
.card.g2{background:linear-gradient(135deg,#061a09,#0e4414)}
.card.go{border-color:#2a7d2a;box-shadow:0 0 14px rgba(125,255,46,.10)}
.card.no{border-color:#7a2a35}
.card.wa{border-color:#7a6612}
.card.empty{border-color:#1c2a20}
.lab{color:#6fe82c}
.eyebrow{color:#6f8472}
.plus{background:#0b150d;color:#6fe82c;box-shadow:0 0 0 1px #1f4a22}
.chips button{background:#0a0e0c;color:#7f9482}
.chips button.on{background:#0e1a10;color:#a8ff6a;border-color:#2a7d2a}
.sc button.on{background:#0e1a10;color:#b6ff80;border-color:#1f4a22}
.rw{background:#090d0b}.rw.on{border-color:#1f4a22}
.rw .ck{border-color:#2a352d}.rw.on .ck{background:#6fe82c;border-color:#6fe82c;color:#03200a}
.seg{background:#090d0b}.seg button.l.on{background:#0d2a12;color:#6fe82c}.seg button.s.on{background:#2a1013;color:#ff5563}
.bar{background:#111815}
.msg,.ins{background:#0a0e0c}
input,select{background:#070a08}
input:focus,select:focus{border-color:#2a7d2a;outline:none}
.b,.btn{background:#6fe82c;color:#04120a;border-color:#6fe82c;box-shadow:none}
.b:hover,.btn:hover{background:#82f040}
.b.alt,.btn.alt{background:transparent;color:var(--ink);border-color:#1f2b23}
.b.alt:hover,.btn.alt:hover{border-color:#2a7d2a;background:transparent}
.tog:hover{border-color:#1f2b23}
.mbtn{color:#6fe82c}
.stp span.on{background:#6fe82c;color:#03200a;border-color:#6fe82c}.stp span.dn2{color:#6fe82c;border-color:#1f4a22}
.sess{background:#0a0e0c}.sess.open{border-color:#2a7d2a;box-shadow:0 0 16px rgba(125,255,46,.10)}
.tile,.kt4>div,.dday{background:#090d0b}
.cd,.cw{background:#090d0b}
.cd:hover,.cw:hover{border-color:#1f4a22}
.cd.off{background:transparent;border-color:#0e1310}
.cd.g{background:#0f2412;border-color:#1f6a24}
.cd.g .dn0,.cd.g b{color:#6fe82c}
.cd.r{background:#2a1013;border-color:#6a2630}.cd.r .dn0,.cd.r b{color:#ff5563}
.cd.td{outline-color:#6fe82c}.cd.sel,.cw.sel{outline-color:#facc15}
svg.eq polyline{filter:drop-shadow(0 0 3px rgba(125,255,46,.5))}
svg path[stroke="#7dff2e"]{filter:drop-shadow(0 0 4px rgba(125,255,46,.55))}
svg path[stroke="#ff4d5e"]{filter:drop-shadow(0 0 3px rgba(255,77,94,.4))}

/* ===== meaning-based colors ===== */
.lab{color:#8fa593}
.card.wa{border-color:#6a2630}
.card.no{border-color:#ff5563;box-shadow:0 0 14px rgba(255,85,99,.14)}
.cd.td{outline-color:#38bdf8}
.ins{border-left-color:#38bdf8}.ins.warn{border-left-color:var(--dn)}.ins.good{border-left-color:var(--up)}
.bar i[style*="--dn"]{box-shadow:0 0 8px rgba(255,85,99,.35)}
.kt4 b.dn,.dk b.dn,.tr b.dn{color:var(--dn)}
.pay{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#090d0b}.pay.ready{border-color:#2a7d2a;box-shadow:0 0 14px rgba(125,255,46,.10)}.pay .pm{display:flex;margin-top:10px}

/* ===== bottom navigation + brand ===== */
.bw{display:flex;align-items:center;gap:12px;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:#62dc34;box-shadow:0 0 10px rgba(98,220,52,.85);flex:none}
.dot.off{background:#7f9482;box-shadow:none}
@media (prefers-reduced-motion:no-preference){.dot:not(.off){animation:pls 2.4s ease-in-out infinite}@keyframes pls{50%{box-shadow:0 0 3px rgba(98,220,52,.4)}}}
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:space-around;align-items:center;gap:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid #141a16;border-radius:0;background:rgba(6,8,8,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
nav.bnav button{flex:1;max-width:86px;height:56px;border-radius:16px}
nav.bnav svg.i{width:29px;height:29px;stroke-width:1.9}
body.auth nav.bnav{display:none}
body.auth .brand{display:none}
main{padding-bottom:118px}

/* ===== header brand ===== */
.brand{display:block;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:27px;font-weight:500;letter-spacing:0;line-height:1.05}
.brand .bn{display:flex;align-items:center;gap:9px}
.brand b{font-weight:500;color:#DCE3E8}
.brand small{display:block;margin-top:5px;font-size:9.5px;font-weight:400;letter-spacing:1.3px;color:#829586;text-transform:uppercase;white-space:nowrap;line-height:1}
@media(max-width:360px){.brand{font-size:26px}.brand small{font-size:9px;letter-spacing:1.2px}}

/* ===== AI insight card ===== */
.card.ai{padding:18px}.card.aid{padding:6px 18px}
.ai-h{display:flex;align-items:center;gap:14px}
.ai-ic{width:52px;height:52px;border-radius:16px;background:#0e1b11;border:1px solid #16301a;display:grid;place-items:center;flex:none}
.ai-t{flex:1;min-width:0}.ai-t b{display:block;font-size:17px;font-weight:700;letter-spacing:.01em;color:#f0f4f0;line-height:1.15}
.ai-t span{display:block;margin-top:3px;font-size:11px;letter-spacing:.07em;color:#829586}
.ai-pill{flex:none;font-size:12px;font-weight:700;letter-spacing:.06em;padding:6px 13px;border-radius:999px;background:#12301a;color:#6fe82c}
.ai-pill.live{background:#0f3a17;color:#8dff3a}.ai-pill.wait{background:#33290c;color:#facc15}.ai-pill.stop{background:#3a1218;color:#ff5563}.ai-pill.rest{background:#18211c;color:#8fa593}
.ai-head{font-size:22px;font-weight:700;line-height:1.25;margin:18px 0 8px;color:#eef6ee}
.ai-body{font-size:15px;line-height:1.5;color:#8ea392;margin:0}
.ai-div{height:1px;background:#1a2a1d;margin:16px 0 4px}
.ai-s{padding:12px 0;border-top:1px solid #131d16}.ai-s:first-of-type{border-top:0}
.ai-l{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#829586;margin-bottom:5px}
.ai-l.up{color:var(--up)}.ai-l.dn{color:var(--dn)}.ai-l.cy{color:var(--cy)}
.ai-s p{margin:0;font-size:14.5px;line-height:1.45;color:#c9d6ca}
.ai-perf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.ai-perf>div{border:1px solid var(--line);border-radius:12px;padding:9px 6px;background:#090d0b;text-align:center;min-width:0}
.ai-perf b{display:block;font-size:15px;white-space:nowrap}.ai-perf span{display:block;margin-top:3px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#829586}
/* ===== sign-in screen ===== */
.au{max-width:420px;margin:0 auto;padding:18px 0 28px}
.au-top{text-align:center;margin:6px 0 26px}.au-top img{border-radius:24px;display:block;margin:0 auto 16px;box-shadow:0 0 0 1px #16301a}
.au-top h1{font-size:30px;font-weight:500;color:#DCE3E8;margin:0 0 8px;letter-spacing:0}
.au-top p{margin:0;font-size:10px;font-weight:400;letter-spacing:1.3px;color:#829586}
.au-card{display:flex;flex-direction:column;gap:14px;padding:20px;border:1px solid var(--line);border-radius:22px;background:#0a0e0c}
.au-card label{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#a9b9ab}

}

msg=msg.startsWith('Setup')?msg:'';render()}
